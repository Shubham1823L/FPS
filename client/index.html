<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FPS Shooter</title>
</head>
<style>
  /* 1. Use a more-intuitive box-sizing model */
  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  /* 2. Remove default margin */
  *:not(dialog) {
    margin: 0;
    padding: 0;
  }

  /* 3. Enable keyword animations */
  @media (prefers-reduced-motion: no-preference) {
    html {
      interpolate-size: allow-keywords;
    }
  }

  body {
    /* 4. Increase line-height */
    line-height: 1.5;
    /* 5. Improve text rendering */
    -webkit-font-smoothing: antialiased;
  }

  /* 6. Improve media defaults */
  img,
  picture,
  video,
  canvas,
  svg {
    display: block;
    max-width: 100%;
  }

  /* 7. Inherit fonts for form controls */
  input,
  button,
  textarea,
  select {
    font: inherit;
  }

  /* 8. Avoid text overflows */
  p,
  h1,
  h2,
  h3,
  h4,
  h5,
  h6 {
    overflow-wrap: break-word;
  }

  /* 9. Improve line wrapping */
  p {
    text-wrap: pretty;
  }

  h1,
  h2,
  h3,
  h4,
  h5,
  h6 {
    text-wrap: balance;
  }

  #playerCoordinates {
    position: absolute;
    right: 0;
    bottom: 0;

    color: white;
    background-color: black;
    font-weight: 500;
    font-size: 32px;
  }

  body {
    background-color: #80a0e0;
  }

  #crosshair {
    --color: white;
    --dim: 1.25rem;
    --gap: .125rem;
    --stroke-width: 1.5px;
    --dot-dim: 2.4px;

    width: var(--dim);
    height: var(--dim);

    position: absolute;
    left: 50%;
    top: 50%;
    translate: -50% -50%;

    display: flex;
    flex-direction: column;
    gap: var(--gap);
  }

  .horizontalCrosshairLines {
    display: flex;
    align-items: center;
    gap: var(--gap);
  }

  .crosshairDot {
    width: var(--dot-dim);
    height: var(--dot-dim);
    border-radius: 50%;

    background-color: var(--color);
  }

  .horizontalCrosshairLine,
  .verticalCrosshairLine {
    flex: 1;
    background-color: var(--color);
  }

  .horizontalCrosshairLine {
    height: var(--stroke-width);
  }

  .verticalCrosshairLine {
    width: var(--stroke-width);
    margin-inline: auto;
  }
</style>

<body>
  <div id="app"></div>
  <div id="crosshair">
    <span class="verticalCrosshairLine"></span>
    <div class="horizontalCrosshairLines">
      <span class="horizontalCrosshairLine"></span>
      <span class="crosshairDot"></span>
      <span class="horizontalCrosshairLine"></span>
    </div>
    <span class="verticalCrosshairLine"></span>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
